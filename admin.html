<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RODREE Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; padding: 40px; line-height: 1.6; }
        .admin-container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 30px; font-weight: 600; color: #c8a96e; }
        form { background: #111; padding: 30px; border-radius: 8px; border: 1px solid #222; margin-bottom: 50px; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; opacity: 0.7; }
        input[type="text"], input[type="email"], input[type="password"], textarea, input[type="file"] {
            width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 12px;
            color: #fff; border-radius: 4px; font-family: inherit; font-size: 1rem;
        }
        button { background: #c8a96e; color: #000; border: none; padding: 12px 30px; border-radius: 4px; cursor: pointer; font-weight: 600; transition: opacity 0.3s; }
        button:hover { opacity: 0.8; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
        .success { background: rgba(0,255,0,0.1); color: #0f0; border: 1px solid #0f0; }
        .error { background: rgba(255,0,0,0.1); color: #f00; border: 1px solid #f00; }
        #preview { max-width: 200px; margin-top: 10px; display: none; border-radius: 4px; }
        .post-list { list-style: none; padding: 0; }
        .post-item { background: #111; border: 1px solid #222; padding: 20px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .post-info h3 { margin: 0 0 5px; font-size: 1.1rem; }
        .post-info span { font-size: 0.8rem; color: #666; }
        .btn-delete { background: #ff4444; color: #fff; padding: 6px 15px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }
        .btn-logout { background: transparent; border: 1px solid #333; color: #999; padding: 8px 20px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; }
        .btn-logout:hover { border-color: #ff4444; color: #ff4444; opacity: 1; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        /* ── LOGIN SCREEN ── */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: -40px;
        }
        #login-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
        }
        #login-box h2 { color: #c8a96e; margin-bottom: 8px; font-size: 1.4rem; }
        #login-box p { color: #555; font-size: 0.85rem; margin-bottom: 30px; }
        #login-error { color: #ff4444; font-size: 0.85rem; margin-top: 12px; min-height: 20px; }
        #login-btn { width: 100%; margin-top: 8px; padding: 14px; font-size: 1rem; }

        /* ── PANEL (oculto hasta autenticar) ── */
        #admin-panel { display: none; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div id="login-box">
            <h2>RODREE Admin</h2>
            <p>Acceso restringido</p>
            <div class="field">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="tu@email.com">
            </div>
            <div class="field">
                <label>Contraseña</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button id="login-btn">Entrar</button>
            <div id="login-error"></div>
        </div>
    </div>

    <!-- ADMIN PANEL (protegido) -->
    <div id="admin-panel">
        <div class="admin-container">
            <div class="admin-header">
                <h1>Admin Panel — RODREE</h1>
                <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
            </div>

            <form id="postForm">
                <div class="field"><label>Título</label><input type="text" id="title" required></div>
                <div class="field"><label>Fecha</label><input type="text" id="date" placeholder="Ej: Abril 2025" required></div>
                <div class="field"><label>Texto Corto (Preview)</label><textarea id="shortText" rows="2" required></textarea></div>
                <div class="field"><label>Cuerpo del Post (Acepta HTML)</label><textarea id="body" rows="8" required></textarea></div>
                <div class="field">
                    <label>Imagen</label>
                    <input type="file" id="imageInput" accept="image/*" required>
                    <img id="preview" src="" alt="Vista previa">
                </div>
                <button type="submit" id="submitBtn">Publicar</button>
                <div id="status"></div>
            </form>

            <h2>Posts publicados</h2>
            <ul id="postList" class="post-list"></ul>
        </div>
    </div>

    <script type="module">
        import { 
            db, 
            auth, 
            collection, 
            addDoc, 
            getDocs, 
            deleteDoc, 
            orderBy, 
            query, 
            doc,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged 
        } from './js/firebase.js';

        const loginScreen = document.getElementById('login-screen');
        const adminPanel  = document.getElementById('admin-panel');
        const loginError  = document.getElementById('login-error');

        // ── AUTH STATE LISTENER ──
        // Este es el guardián: si hay sesión activa muestra el panel, si no muestra el login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                adminPanel.style.display  = 'block';
                loadPosts();
            } else {
                loginScreen.style.display = 'flex';
                adminPanel.style.display  = 'none';
            }
        });

        // ── LOGIN ──
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            loginError.textContent = '';

            if (!email || !password) {
                loginError.textContent = 'Completá email y contraseña.';
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // onAuthStateChanged se dispara automáticamente y muestra el panel
            } catch (err) {
                loginError.textContent = 'Email o contraseña incorrectos.';
                console.error(err);
            }
        });

        // Enter en el campo contraseña también dispara el login
        document.getElementById('login-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('login-btn').click();
        });

        // ── LOGOUT ──
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth);
        });

        // ── CLOUDINARY UPLOAD ──
        const imageInput = document.getElementById('imageInput');
        const preview    = document.getElementById('preview');

        imageInput.onchange = () => {
            const [file] = imageInput.files;
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
        };

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'rodree_unsigned');
            const res  = await fetch('https://api.cloudinary.com/v1_1/dmevslp0p/image/upload', { method: 'POST', body: formData });
            const data = await res.json();
            return data.secure_url;
        }

        // ── CARGAR POSTS ──
        async function loadPosts() {
            const postList = document.getElementById('postList');
            postList.innerHTML = '';
            const q             = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);
            querySnapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const li   = document.createElement('li');
                li.className = 'post-item';
                li.innerHTML = `
                    <div class="post-info">
                        <h3>${post.title}</h3>
                        <span>${post.date}</span>
                    </div>
                    <button class="btn-delete" data-id="${docSnap.id}">Eliminar</button>
                `;
                postList.appendChild(li);
            });
        }

        // ── ELIMINAR POST ──
        document.getElementById('postList').addEventListener('click', async (e) => {
            if (e.target.classList.contains('btn-delete')) {
                const id = e.target.getAttribute('data-id');
                if (confirm('¿Eliminar este post?')) {
                    await deleteDoc(doc(db, "posts", id));
                    loadPosts();
                }
            }
        });

        // ── PUBLICAR POST ──
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const status    = document.getElementById('status');
            submitBtn.disabled    = true;
            submitBtn.textContent = 'Publicando...';
            status.style.display  = 'none';

            try {
                const imageUrl = await uploadToCloudinary(imageInput.files[0]);
                await addDoc(collection(db, "posts"), {
                    title:     document.getElementById('title').value,
                    date:      document.getElementById('date').value,
                    shortText: document.getElementById('shortText').value,
                    body:      document.getElementById('body').value,
                    imageUrl,
                    createdAt: new Date()
                });
                status.textContent    = '✓ Post publicado con éxito';
                status.className      = 'success';
                status.style.display  = 'block';
                e.target.reset();
                preview.style.display = 'none';
                loadPosts();
            } catch (err) {
                console.error(err);
                status.textContent   = 'Error al publicar. Revisá la consola.';
                status.className     = 'error';
                status.style.display = 'block';
            } finally {
                submitBtn.disabled    = false;
                submitBtn.textContent = 'Publicar';
            }
        });
    </script>
</body>
</html>
